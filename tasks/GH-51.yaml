goal: |
  让 sandbox_runtime/tests/policy/test_paths.py 在 Windows 上稳定通过：
  Issue #51 报告 mklink /J 建好 junction 之后，第 41 行
  `root.mkdir(parents=True)` 抛 FileExistsError [WinError 183]
  (ERROR_ALREADY_EXISTS)，测试在进入 containment 断言之前就 ERROR，
  GH-20 的 junction 回归保护因此失去覆盖。

scope: |
  In scope（仅测试脚手架，不改任何被测行为）:
  - sandbox_runtime/tests/policy/test_paths.py：
    (1) junction 创建加重试 + 创建后「是否真的可穿越」的就绪校验
        （os.path.samefile，跨 Python 版本可用；3.9 的 os.path.islink
        对 junction 返回 False，不能用）；
    (2) 对 WinError 183/145（ERROR_ALREADY_EXISTS / ERROR_DIR_NOT_EMPTY）
        做有界退避重试的 mkdir 助手；
    (3) 为该重试助手加一条确定性回归测试（monkeypatch 模拟先失败后成功）。
  Out of scope:
  - aedl_sandbox.policy.paths.is_within 的实现与语义（这是被测对象，不得改）；
  - sandbox_runtime 下任何其他文件、gates/**、src/**、delivery/**、
    notes/m2-*/**、.gitattributes、任何 Evidence 字节；
  - 不做 Windows 平台守卫来回避断言：不把真实失败降级成 skip；
    只有「mklink 不可用」才 skip（沿用既有语义）。

