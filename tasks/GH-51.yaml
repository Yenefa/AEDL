  - 该测试文件单独连跑 20 次全绿（Issue 原始报告环境本机不可得，
    因此以「可重复执行 + 回归测试覆盖重试逻辑」作为可验证口径）；
  - 新增的回归测试在不打补丁的情况下会失败（先确认它能捕获回归），
    打上补丁后通过；
  - py -3 -m tools.dev_gate --envelope tasks/GH-51.yaml exit 0，
    scope_check / binding_check 均在 checks 内且非 excluded。

