acceptance: |
  - 正对照 native：DC-01/DC-02/DC-03 分别以 rule `E1`/`E2`/`E3` 走 `CONSTRAINED_EXCEPTION`，
    断言 `status == APPLIED_TO_STAGE`、`tool["tool_applied"] is None`、`changed is True`、
    `op_results` 逐一覆盖且 status 全 `ok`；**并断言 writer 真的跑了**（`exit_code == 0`），
    以排除「因别的原因提前返回」的假绿
  - 负扰动 native：同样三个夹具，op 固定为 `add_net_label name=+3V3 at=C2.1`，断言
    `status != APPLIED_TO_STAGE` 且 `reasons` 含 **`REPAIR_EFFECT_MISMATCH`**；同时断言该红
    **确实发生在 writer 之后**：`tool["tool_applied"] is None`、`changed is False`、
    `op_results` 非空且全 `ok`、`exit_code == 0` —— 否则就是判据 §1 规则 2 所说的「假红」
  - **判定有效性内联强制**（判据 C4-P3 的 qualification validity）：负扰动用例在施加扰动**之前**
    先在同一夹具上跑正对照并断言其通过；正对照一旦失败，该用例也随之失败——
    即「正对照失败 → qualification invalid」，红负扰动不能单独把 P3 判成 PASS
  - 未 opt-in 时原生类 SKIP 并如实标注；opt-in 后缺工具/坏版本必须 FAIL 不得 SKIP
  - tests.test_akcli_adapter 全绿；全量 discover 不回归；dev_gate 带本 envelope 通过
  - 台账 + HANDOFF 如实追加，并写明 P3 的证据等级为 **native**（正对照与负扰动均为原生，
    无 stub 成分）；若最终有任何一半降级，必须如实标注为 stub/hybrid 且给 NOT_REACHABLE 理由
  - 状态 PENDING_HUMAN_REVIEW

