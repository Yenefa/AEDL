  Potentially affected:   C4 组的整体通过判据（P3 归位后，仍未齐备的只剩 C4-P8 native 的
                          词表边界结论，已由 PR #78 记录为 NOT_REACHABLE）
  Explicitly not touched: tools/**、gates/**、src/**、sandbox_runtime/**、notes/**、
                          docs/evidence/**、tests/fixtures/repair_pr1/**
  Risk: LOW（只新增 opt-in 测试；扰动只作用在冻结夹具的 scratch 副本上）

