  只新增/扩展 tests/test_akcli_adapter.py 内的 opt-in 原生 qualification 用例与必要的
  最小测试工具改动；**不改被验对象**（tools/akcli_adapter.py），不改 gates/**、src/**、
  sandbox_runtime/**、tools/repair_pipeline.py、notes/b5-acceptance/**（冻结判据）、
  docs/competition/**、docs/evidence/**、tests/fixtures/repair_pr1/**。

  Impact Analysis

