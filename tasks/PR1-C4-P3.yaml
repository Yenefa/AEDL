# Task Envelope — PR1-C4-P3  C4-P3 native qualification (positive control + fixed negative perturbation)
# 判据唯一来源：notes/b5-acceptance/C3-C6_PERTURBATION_CRITERIA_DRAFT.md §C4 的 C4-P3 行
# （**draft-5**，已随 PR #80 合入 master `f16b427`；本卡只读，不改判据）。
# 先例：tasks/PR1-C4-PQ.yaml（C4-P1）、tasks/PR1-C4-P2P8.yaml（C4-P2..P8）。
#
# 本卡是**验收侧**卡片：`tools/**`、`gates/**`、`notes/**` 为 forbidden，不改被验对象。
# 若 qualification 暴露 adapter 缺陷：STOP → 记 BLOCKED → 升级 Owner。

task: PR1-C4-P3

base:
  branch: test-pr1-c4-p3-qualification
  sha: f16b427963c180b2af5aa397752aa5cd52c0aa84

goal: |
  把 §C4 的 **C4-P3** 推进到 qualification，并**证明两半都能用真工具链跑**（不必降级到 stub）。
  判据 draft-5 把 P3 定义为一个**正对照**加一个**真扰动**：

    正对照 : tool_applied=null 且独立条件全成立（op_results 完整且全 ok、源 bytes 确实改变、
             fresh reread 成功、connectivity gate 成立）→ 允许 APPLIED_TO_STAGE
    负扰动 : tool_applied=null、op_results 非空且全 ok，但**源 bytes 不改变**
             → 必须非 APPLIED_TO_STAGE，且 reasons 含 REPAIR_EFFECT_MISMATCH
    判定有效性 : 正对照必须先通过；正对照失败 → 本条 NOT_RUN / qualification invalid，
             不得因负扰动是红的就算 PASS

  **开工 bounded probe（2026-09-18，真 akcli 0.21.0，只作用在 scratch 副本）已证明两半都 native 可达**：

  - 正对照（native，三个夹具）：DC-01 → rule `E1`、DC-02 → `E2`、DC-03 → `E3`，
    全部 `CONSTRAINED_EXCEPTION`；实测 `status=APPLIED_TO_STAGE`、`tool_applied=None`、
    `changed=True`、`exit=0`、op status 全 `ok`（4 / 1 / 4 个 op）。
  - 负扰动（native，同样三个夹具）：`add_net_label name=+3V3 at=C2.1`（C2.1 本就在 +3V3 上，
    故是不改字节的 no-op），实测 `status=BLOCKED`、`changed=False`、`tool_applied=None`、
    `ops=['ok']`、`exit=0`，reasons = **`REPAIR_EFFECT_MISMATCH`**（+ `REPAIR_DELTA_MISMATCH`）。
    **两次独立运行逐字段相同**，连 created_uuid 都稳定（`1d801691-1263-56ad-b675-4a56a3e789b5`）。

  因此本卡**不需要 stub、不需要新夹具、不需要扩词表** —— 与 Owner 对 #78 的裁定
  （「native 做不到就明确降级，不制造 fixture」）一致，而这次是**不必降级**。

