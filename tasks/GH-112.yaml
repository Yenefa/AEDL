acceptance: |
  - A single CLI subcommand assembles a `SandboxOrchestrator` whose `repair` port
    is a real `LLMRepairPort`, with policy / executor / verifier / trust /
    workspace hardcoded by the ASSEMBLY, never chosen by the agent (N8).
  - A test drives the assembled orchestrator end to end with a
    `FakeModelAdapter` and an injected transport, and NO network call is made --
    asserted, not assumed.
  - The API key is read from the environment only; passing it as an argument is
    REFUSED, so it cannot reach a process listing or shell history.
  - A missing or blank key is refused BY NAME, before any assembly, and the
    refusal says which variable to set.
  - `action_schema` derives from `policy.engine.SUBJECT_SPECS` and a test fails
    if the two can disagree. An action offered to the model but unknown to the
    validator is a silent 100% rejection rate at runtime.
  - `allowlist` is PROJECTED, not defaulted empty: an empty `allowed_components`
    makes every component proposal fail closed, so the wiring either sources it
    from the run's own state or says loudly that it cannot.
  - A mutation swapping the real `LLMRepairPort` back for `_TestOnlyRepair` is
    KILLED by the suite. A wiring test that cannot fail is worse than none.
  - No existing test weakened, skipped, or deleted to make this pass.
  - `python -m tools.dev_gate --envelope tasks/GH-112.yaml` exits 0.
  - Full sandbox and main suites stay green on Windows and on Linux (WSL2), at
    or above the current 440 / 1223.

known_limitations:
  - "UNKNOWN: real-model output quality. Every test runs against
     FakeModelAdapter. Whether a real model produces proposals that survive
     repair_agent's three static checks is NOT_RUN and cannot be answered before
     a key exists. This task delivers REACHABILITY, not EFFECTIVENESS, and must
     not be described as the latter."
  - "UNKNOWN: benchmark. There is no ground truth in this repository, so nothing
     here can claim the agent repairs anything. Issue #73 is open."
  - "The `allowlist` projection is the part with genuine design latitude. It is
     recorded as a decision with its reasoning, not presented as mechanical."
  - "TO_VERIFY: RFC section 2.5 N8 is read here as already satisfied by the
     existing isinstance-checked constructor. That reading is stated, not assumed
     -- the five BLOCKING items are an Owner release decision and this task does
     not make it."

change_budget:
  expected_files: 7
  expected_modules: [sandbox-adapters, sandbox-cli, sandbox-tests, tasks, compliance]
  cross_module: true
  contract_change: false
  evidence_semantics_change: false
  # contract_change: false is a CONSTRAINT, not a default. The frozen
  # RepairPort.propose signature is the contract; this task plugs into it rather
  # than widening it. If the implementation turns out to need a signature change,
  # that is a STOP-and-escalate, never a quiet edit.

