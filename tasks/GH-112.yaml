task: GH-112

base:
  branch: feat/arh-live-wiring
  sha: a92971619b76d6831b1736352c8b52e9459e9df0

goal: |
  Wire the ARH LLM repair agent into the real runtime so one CLI command can
  drive a full `propose -> policy -> execute -> verify` round, stopping exactly
  one step short of configuring a real API key.

  Today the agent cannot be used at all: nothing outside `arh/` references it,
  and the only `RepairPort` implementation the CLI can reach is
  `adapters._TestOnlyRepair`. The 141 green ARH tests prove the harness matches
  its own spec; they prove nothing about anything running.

  The injection point already exists and is already hardcoded by type
  (`SandboxOrchestrator.__init__` takes `repair: RepairPort` and isinstance-checks
  it), so RFC section 2.5 N8 looks already satisfied. What is missing is the
  assembly around it, not the contract.

  This task delivers REACHABILITY, not EFFECTIVENESS. Saying otherwise would be
  an unsupported claim.

scope: |
  In scope:
  - `sandbox_runtime/src/aedl_sandbox/adapters.py`
      * a `ContextInputsProvider` implementation that PROJECTS run state per
        RFC 3.2 / D6 (never an `engine.document` dump)
      * `action_schema` DERIVED from `policy.engine.SUBJECT_SPECS`, so the actions
        offered to the model and the actions the validator knows cannot drift
      * a real assembly function building `LLMRepairPort` with an explicit
        `TrajectoryRecorder`, a `BudgetStop`, and an explicitly supplied
        transport (the adapter has no default transport by design: real I/O is
        only reachable if runtime wiring hands one in)
  - `sandbox_runtime/src/aedl_sandbox/cli.py`
      * one subcommand that assembles the above and runs the orchestrator
      * the API key is read from an ENVIRONMENT VARIABLE ONLY. Passing it as an
        argument is REFUSED, because argv reaches process listings and shell
        history. A missing or blank key is a NAMED fail-closed refusal raised
        before any assembly, naming the variable to set.
  - `sandbox_runtime/tests/arh/**`
      * assembly tests over `FakeModelAdapter` and an injected transport: zero
        network, ASSERTED rather than assumed
      * a test that a missing key refuses by name
      * a test that `action_schema` cannot drift from `SUBJECT_SPECS`
  - `tasks/GH-112.yaml`
  - `docs/compliance/ai-usage/**`, `docs/compliance/AI_USAGE_LOG.md`
  - `docs/compliance/DECISIONS.md`

  Out of scope, explicitly:
  - **No API key is configured, stored, or read from a file, and no real network
    call is made.** The task ends AT the API boundary, by instruction: the key is
    a configuration decision (whose account, whose cost), not an engineering one.
  - No change to `arh/**` internals unless a test proves one unreachable. The
    harness is not the thing being changed; the assembly around it is.
  - No change to `orchestrator.py` -- the injection point exists and is already
    type-checked.
  - No change to `policy/**`, `trust/**`, `state.py`, `protocol.py`.
  - `gates/**`, `docs/evidence/**`, `tools/**`, `.github/**`, `src/**` untouched.
    The Verification Policy is therefore unchanged and the two-owner GH-20
    confirmation is NOT triggered.
  - No benchmark, and no claim that the agent repairs anything real.

dependencies: []

allowed_paths:
  - sandbox_runtime/src/aedl_sandbox/adapters.py
  - sandbox_runtime/src/aedl_sandbox/cli.py
  - sandbox_runtime/tests/arh/**
  - tasks/GH-112.yaml
  - docs/compliance/DECISIONS.md
  - docs/compliance/ai-usage/**
  - docs/compliance/AI_USAGE_LOG.md

