acceptance: |
  - `_commit_predicate` evaluates all nine conjuncts of contract 337-347 and
    returns a REASON for each one that fails. A test drives each conjunct to
    failure individually -- a predicate that only ever returns one reason is a
    predicate that only ever checks one thing.
  - The predicate is a pure function: no filesystem, no globals mutated, and
    the same inputs give the same reasons. Tested by calling it directly.
  - The lock conjunct (346) is evaluated and, with no lock primitive in the
    repo, is reported as NOT SATISFIED. A test asserts the round refuses rather
    than proceeding. Silently omitting a conjunct is the failure this test
    exists to prevent.
  - COMMIT_INTENT is persisted and fsync'd BEFORE the design is written, and
    carries the verified staged hash. A fault-injection test kills the process
    between INTENT and the replace and asserts the INTENT is on disk with the
    right hash.
  - The design write is temp-in-the-same-directory -> flush -> fsync ->
    os.replace -> directory fsync. Tested by asserting no temp file survives a
    successful write, and that a fault before the replace leaves the candidate
    design byte-identical to its snapshot.
  - After the replace, the final design is verified byte for byte AND by hash.
    A test corrupts the bytes between replace and verify and asserts the round
    refuses rather than reporting COMMITTED.
  - The terminal record is written before COMMITTED is published. A test kills
    the process after the replace and before the terminal record and asserts the
    status is NOT COMMITTED.
  - `commit:{attempted, replaced, verified}` is present in every receipt, with
    the values reflecting what actually happened, not what was intended.
  - COMMITTED is the only status that projects APPLIED_TO_CANDIDATE. The
    existing test for this is extended to cover a real committed round rather
    than only the mapping function.
  - A round that is refused before COMMIT reports `commit.attempted == False`
    and `rollback.status == "NOT_NEEDED"` (contract 388).
  - PRECHECK refuses when a prior transaction left a COMMIT_INTENT with no
    terminal record, and the reason names the journal path. This is contract
    387's "不猜测这次已经成功" and is what makes the missing restore safe.
  - Every existing test that asserted COMMITTED was structurally impossible is
    deliberately rewritten -- deleted, inverted or narrowed -- with the reason
    recorded in the commit message. Silently deleting a test is not acceptable.
  - The full suite stays green, every new test is mutation-verified, and
    `py -3 -m tools.dev_gate --envelope tasks/PR1-C5-COMMIT.yaml` exits 0.

not_implemented_and_declared:
