task: PR1-C5-COMMIT

base:
  branch: feat/c5-commit-phase
  sha: 3e5cd88

goal: |
  Implement the COMMIT phase, and only the part of it that can be made safe
  without inventing a recovery subsystem.

  Contract line 374, verbatim, in order:

    "再次检查 commit 谓词；先持久化 COMMIT_INTENT 与 verified staged hash；
     从 stage 读取固定 bytes，hash 对齐；同一 design 目录写临时文件、
     flush/fsync、原子 replace；逐字节和 hash 核验最终 design"

    "权限/输入/stage/report 漂移 -> 不 replace 并 ROLLBACK；
     replace/post-read/journal 错误 -> 依恢复规则处理。
     禁止为了提交重跑 op-list。
     只有已验证 bytes、最终核验与 terminal journal 均完成才 COMMITTED。"

  So COMMIT is: re-check the predicate, persist INTENT, read the stage bytes,
  atomically replace the candidate's design file, verify the result byte for
  byte, write a terminal record, and only then say COMMITTED.

  The predicate is contract 335-347, a NINE-way conjunction. It is not a
  formality: line 349 says "这是合取，没有'置信度高''仅 warning''多数 checks
  PASS'的例外."

  What exists today, measured: `os.replace`, `os.fsync`, `O_EXCL` and any
  notion of a journal appear ZERO times in tools/repair_pipeline.py,
  tools/host_toolchain.py and gates/repair_verification.py. `lock_path` is
  validated as a path field and nothing acquires it. `_round_receipt` has no
  `commit` key. So this is not a wiring task; it is three new primitives
  (durable journal, atomic design write, commit predicate) plus the phase.

scope: |
  In scope:
  - tools/repair_pipeline.py:
      * `_write_journal_record` -- an append-only, fsync'd record of
        COMMIT_INTENT and TERMINAL. Contract 390: "事务锁、不可变快照、
        COMMIT_INTENT、terminal record 都必须在对应副作用前/后按规定持久化."
      * `_atomic_replace_file` -- temp in the SAME directory, write, flush,
        fsync, os.replace, then fsync the directory. Contract 374 and 385 both
        require exactly this sequence; the contract's own recovery write uses
        it too.
      * `_commit_predicate` -- the nine conjuncts of contract 337-347, as a
        PURE function returning (ok, reasons) so it is testable without running
        a transaction, following the `_delta_refusal` / `_thin_verification_
        refusal` precedent already in this file.
      * `run_round`'s COMMIT phase, and `commit:{attempted, replaced, verified}`
        in the receipt per contract 404.
      * PRECHECK refuses when a previous transaction left a COMMIT_INTENT with
        no terminal record. This is the fail-closed half of recovery rule 4 and
        it is what makes shipping COMMIT without a restore defensible.
  - tests/test_repair_pipeline.py: the predicate table, the atomic write under
    fault injection, the journal, the COMMIT phase, and deliberate rewrites of
    the existing tests that assert COMMITTED is impossible.
  - tasks/PR1-C5-COMMIT.yaml
  - docs/compliance/ai-/**, docs/compliance/AI_USAGE_LOG.md, and
    docs/compliance/DECISIONS.md ONLY if a decision is actually made.

  Out of scope, explicitly:
  - **No restore.** Contract 385's recovery write and rules 1/3/5 are NOT
    implemented. A transaction whose INTENT has no terminal record is refused
    at PRECHECK with BLOCKED and a reason naming the exact journal path a human
    must read. This is reported as NOT implemented in the PR, in the AI usage
    entry, and in the receipt's own `rollback` field. Claiming a restore works
    would be the exact failure mode this repository keeps hitting.
  - **No single-writer lock.** Contract 346 makes "单写者锁仍由本事务持有" a
    conjunct of the predicate. No lock primitive exists anywhere in the repo.
    Implementing one is its own change. Until then the conjunct is reported as
    NOT SATISFIED and the round refuses, rather than being quietly dropped from
    the conjunction. `NOT_FOUND`, deferred to its own PR.
  - **No `CandidateWorkspace.candidate_hash` finalisation** (contract 414).
  - **No NO_CHANGE idempotent replay** (contract 392). The predicate machinery
    it needs is the same; the key index `(run_id,candidate_id,patch_id)` is not
    built. Deferred.
  - **No ERC / DRC / render / evidence work.** `docs/evidence/**` remains frozen
    (PR #94 review). ADR-014's `ignored_checks` constraint still binds PR-2.
  - No change to `gates/**`, `sandbox_runtime/**`, `src/**`,
    `tools/akcli_adapter.py`, `tools/host_toolchain.py`, `tools/board_review.py`.

dependencies: []
  # Same reasoning as PR1-C5-VERIFY-STAGE: the primitives are ancestors of this
