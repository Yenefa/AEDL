  - "Contract 385's restore (recovery rules 1, 2, 3, 5): the actual write-back
     from the snapshot. NOT implemented. A stale INTENT refuses at PRECHECK."
  - "The single-writer lock (contract 346, 369, 376). No primitive exists in the
     repo. NOT implemented; the conjunct is reported unsatisfied."
  - "NO_CHANGE idempotent replay (contract 392). The key index is not built."
  - "Final candidate_hash + .actions.jsonl write (contract 414)."

