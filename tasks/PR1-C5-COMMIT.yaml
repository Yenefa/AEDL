task: PR1-C5-COMMIT

base:
  branch: feat/c5-commit-phase
  sha: 3e5cd88

goal: |
  Land the two parts of COMMIT that are safe WITHOUT the writer, and declare the
  rest as not implemented rather than shipping half a commit.

  Contract 374's COMMIT row has two halves, and they are not separable in the way
  the first draft of this envelope assumed:

    WRITING (deliberately NOT here)
      "先持久化 COMMIT_INTENT 与 verified staged hash；从 stage 读取固定 bytes，
       hash 对齐；同一 design 目录写临时文件、flush/fsync、原子 replace；逐字节
       和 hash 核验最终 design ... 只有已验证 bytes、最终核验与 terminal
       journal 均完成才 COMMITTED"

    PREDICATE (here)
      Contract 335-347, the nine-way conjunction, which line 374's first act
      requires and which line 349 makes non-negotiable: "这是合取，没有'置信度高'
      '仅 warning''多数 checks PASS'的例外."

  The writing half cannot ship alone. Contract 387 requires a RESTORE for a
  transaction that has a COMMIT_INTENT and no terminal record -- "无 COMMITTED
  terminal record 的事务，即使有 COMMIT_INTENT 且 live=after，也按第2条恢复；
  不猜测这次已经成功" -- and 385 makes that restore a write from the snapshot.
  With no restore, a single I/O fault during the replace leaves a candidate that
  needs a human forever, in order to satisfy a predicate that could not be
  satisfied anyway: contract 346 requires the single-writer lock, no lock
  primitive exists anywhere in this repository, and Owner ruled 2026-09-28 that
  the lock is its own PR.

  So this increment lands:

    * `_commit_predicate` -- the nine conjuncts as a PURE function, so each is
      testable in isolation and none can be quietly dropped or aliased;
    * the durable journal READ path, wired into PRECHECK per contract 369
      ("先处理未完成事务"), so a stale COMMIT_INTENT fails CLOSED instead of
      being ignored;
    * the receipt fields of contract 404/405, with values that mean "nothing was
      attempted";
    * a structural declaration of what is missing, as a receipt FIELD rather than
      as a comment.

  The round is therefore still unpromoted, exactly as before, and no existing
  test needed to be weakened -- which is the honest signature of an increment
  that adds a gate without granting a promotion.

scope: |
  In scope:
  - tools/repair_pipeline.py:
      * `_commit_predicate` -- contract 337-347 as a pure function returning
        (ok, reasons, unsatisfied_conjuncts). No filesystem, no clock, no
        mutation; everything it needs is an argument. That is what makes each
        conjunct drivable to failure with the other eight satisfied, which is the
        only way to know all nine are checked.
      * `COMMIT_CONJUNCTS` and `COMMIT_ROUTES`, so a reason names WHICH conjunct
        failed and the route set is not restated from memory. The routes are
        STRICT and CONSTRAINED_EXCEPTION, read from the policy document; the
        first draft listed a route that exists nowhere, so three rules could
        never have committed.
      * `_journal_file`, `_read_journal`, `_unresolved_intents` -- the durable
        journal at `<repair_root>/journal.jsonl`, read WITHOUT skipping bad
        lines. Contract 387 forbids a history reader that skips unparseable
        lines from being the sole basis of recovery, because a truncated record
        then reads as "no record" and the round concludes it never committed. A
        torn FINAL line is the normal artefact of a crash mid-append, so it is
        identified as such and fails closed.
      * `run_round`'s COMMIT phase: evaluate the predicate, publish
        `commit_predicate`, publish `rollback` whose `VERIFIED` is EARNED by the
        byte/manifest comparison (contract 384) rather than asserted.
      * PRECHECK: refuse when a previous transaction left an unresolved
        COMMIT_INTENT, or when the journal holds a record this reader cannot
        trust. It REFUSES rather than cleaning up, because rule 3 (386) requires
        that a live design which is neither the recorded before nor the after
        bytes be QUARANTINED -- "隔离现场，不覆盖可能的人类/其他进程修改" -- not
        overwritten by a repair round. Guessing could destroy a human's edit.
  - tests/test_repair_pipeline.py: `CommitPredicateTests`,
    `CommitJournalTests`, `CommitReceiptTests`.
  - tasks/PR1-C5-COMMIT.yaml
  - docs/compliance/ai-usage/**, docs/compliance/AI_USAGE_LOG.md

  Out of scope, explicitly:
  - **No COMMIT_INTENT write, no atomic design replace, no terminal record.**
    Deferred to the PR that brings the single-writer lock AND the restore
    together. See `not_implemented_and_declared`.
  - **No restore** (contract 385, rules 1/2/3/5). A stale INTENT refuses.
  - **No single-writer lock** (contract 346, 369, 376). `lock_path` is validated
    as a path field and nothing has ever acquired it; `msvcrt|flock|LockFileEx|
    filelock|portalocker` is `NOT_FOUND` in AEDL code. The conjunct is reported
    unsatisfied, not assumed. Owner ruled 2026-09-28: separate PR.
  - **No one-write-call count** (contract 339). `apply_stage`'s receipt carries
    no call counter, so the conjunct is not checkable. Reported unsatisfied
    rather than reduced to three of its four halves -- 349 forbids treating
    UNKNOWN as satisfied. Emitting the counter is a change to
    `tools/akcli_adapter.py`, which is forbidden here.
  - **No NO_CHANGE idempotent replay** (contract 392); the
    `(run_id, candidate_id, patch_id)` key index is not built.
  - **No `CandidateWorkspace.candidate_hash` finalisation** (contract 414).
  - **No ERC / DRC / render / evidence work.** `docs/evidence/**` remains frozen
    (PR #94 review). ADR-014's `ignored_checks` constraint still binds PR-2.
  - **No contract 378 per-component re-check at COMMIT** (`resolve_within(...,
    strict=True)` on the candidate root, per-path-component symlink/reparse
    checks, file link count). `build_file_manifest` checks per-file
    `is_symlink()` and containment but not `st_nlink`, and the root is not
    re-resolved. Recorded as a known gap, not silently skipped.
  - No change to `gates/**`, `sandbox_runtime/**`, `src/**`,
    `tools/akcli_adapter.py`, `tools/host_toolchain.py`, `tools/board_review.py`.

dependencies: []
  # Same reasoning as PR1-C5-VERIFY-STAGE: the primitives are ancestors of this
