acceptance: |
  - `_commit_predicate` evaluates all nine conjuncts of contract 337-347 and names
    each one that fails. `test_every_conjunct_is_independently_observable` drives
    each conjunct to failure with the other eight satisfied -- a predicate that
    checks one thing twice under two names cannot produce that table. This
    matters concretely: the first draft aliased conjuncts 5 and 6 to one check.
  - The predicate is pure. Tested by calling it directly and asserting the same
    inputs give the same answer twice.
  - Conjunct 4 defers to the verifier rather than re-deriving line 333.
    `gates/repair_verification.py:2006-2019` already evaluates the whole
    invariant set and collapses it to `status`. A test feeds the predicate a thin
    result in the REAL shape -- dict-valued `checks` and `parser_agreement`, and
    `coverage` carrying `complete` -- because the first draft read all three as
    strings and was therefore False for every genuine PASS. That was the third
    instance of the PR #99 mistake: a parallel object instead of the repository's.
  - The route set is read from `src/repair/topology_policy_v1.json` and compared
    against `COMMIT_ROUTES`, so a test cannot pass by restating a wrong constant.
  - The one-write-call conjunct is reported unsatisfied, and a test asserts the
    conjunct still fails when `one_write_call` is absent from the stage receipt.
  - A live design that DIFFERS from the round snapshot fails conjunct 344 -- with
    a genuine manifest mismatch, not merely an exception. Without this,
    hard-coding the comparison to True survives, because the only other test
    asserts the conjunct is absent from the unsatisfied list.
  - Stage bytes that move after the verifier returned fail conjunct 343. The
    lever is real: the request carries `stage_root`, so the stub can modify the
    stage exactly as a concurrent writer would.
  - A torn final journal line is reported as a tear and fails closed. A reader
    that skipped it would conclude the round never committed, which is the exact
    inversion contract 387 forbids.
  - A journal record missing a field is reported, not accepted. A corrupt interior
    line is reported and distinguished from a torn final line.
  - PRECHECK refuses when a previous transaction left an unresolved
    COMMIT_INTENT, and the reason names both the transaction and the journal path
    a human has to read. The test pins the journal path the round reads, so a
    typo cannot make the refusal test pass vacuously -- an absent journal also
    reports "no pending intents".
  - PRECHECK refuses when the journal holds a record this reader cannot trust.
  - `rollback.status == "VERIFIED"` is published ONLY alongside a real comparison
    and `byte_equal is True`. An uncomparable or mismatched live design yields
    `UNKNOWN` with `byte_equal is None`. Contract 384.
  - `commit` keeps contract 404's closed shape: exactly `attempted`, `replaced`,
    `verified`. The predicate verdict lives in `commit_predicate`.
  - The round still cannot commit: `status is None`, `terminal is False`,
    `pending_phases == ["COMMIT"]`, and the candidate design is byte-identical to
    what the snapshot recorded.
  - The absence of the writer is a receipt FIELD (`writer_available: False` plus
    `not_implemented`), not a comment. The first draft's refusal text claimed
    "the next round will refuse at PRECHECK" while nothing read the journal.
  - `run_round` never raises on any thin verdict, for any of the five statuses.
    The first draft had a NameError from an unbound name, a missing `hashlib`
    import inside the commit path, and a keyword argument that does not exist --
    all three escaping `run_round` instead of refusing.
  - Every new test is mutation-verified. `mut_commit.py` applies 15 mutations,
    each reintroducing one defect actually found in this increment, and all 15
    must be detected.
  - The full suite stays green with NO existing test weakened, and
    `py -3 -m tools.dev_gate --envelope tasks/PR1-C5-COMMIT.yaml` exits 0.

not_implemented_and_declared:
  # Recorded here, in the receipt, and in the PR, so the claim can be checked
  # against a list rather than against prose.
  - "COMMIT_INTENT write, atomic design replace, terminal record (contract 374's
     writing half). NOT implemented. They ship with the lock and the restore,
     because a durable INTENT with no restore is strictly worse than no commit."
  - "The restore of contract 385 and recovery rules 1/2/3/5. NOT implemented. A
     stale INTENT refuses at PRECHECK with the journal path named."
  - "The single-writer lock (contract 346, 369, 376). NOT implemented; no
     primitive exists. The conjunct is reported unsatisfied. Owner's ruling
     2026-09-28: separate PR."
  - "The one-write-call count (contract 339). NOT implemented; `apply_stage`
     records no counter, so the conjunct is reported unsatisfied."
  - "NO_CHANGE idempotent replay (contract 392). The key index is not built."
  - "Final candidate_hash + .actions.jsonl write (contract 414)."
  - "Contract 378's per-component re-resolution and file link-count check at
     COMMIT. `build_file_manifest` checks per-file is_symlink and containment but
     not st_nlink, and the candidate root is not re-resolved with strict=True."

design_frozen_by_owner:
  ruling_1: "关闭 PR #99 -- it implemented a parallel evidence path, not the contract's verifier"
  ruling_2: "不要把 PR #99 的工具身份逻辑移植进 fresh_export"
  ruling_3: "处理 ignored_checks -- `violations == []` is not evidence. Recorded as ADR-014."
  ruling_4: >-
    2026-09-28, asked directly whether to implement the single-writer lock in
    this increment: 「锁单独开一个 PR，本轮如实标记不可达」. The lock is its own PR;
    this round marks the unreachability honestly.
  ruling_5: >-
    2026-09-28: 「停止所有人工review纪律，全量推进我们的项目主线」. Merging is
    authorised for this run with the Owner's explicit acceptance that it may need
    reverting. This does NOT lower the bar on what the code must do: every
    conjunct is either satisfied or reported unsatisfied, and nothing is omitted
    to make a round succeed.

