  Potentially affected:   C4-PRECHECK 的 op-list 相等判定；任何依赖「absent 与 explicit 0
                          等价」的既有用例（须逐条复核并如实说明，不得为通过而放宽断言）
  Explicitly not touched: tools/repair_pipeline.py（C1，Owner grant 明确禁止）、
                          gates/**、src/**、sandbox_runtime/**、tools/host_toolchain.py、
                          tests/fixtures/**、docs/evidence/**、delivery/**、.gitattributes
  Risk: LOW（改动只在比较侧；失败类别与 reason code 不变，仅让原本漏放的输入在写前被 BLOCKED）

