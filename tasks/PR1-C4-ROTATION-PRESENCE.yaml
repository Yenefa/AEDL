acceptance: |
  - 四种 presence case 必须锁死（Issue #86 原文口径，Owner 未放松）：
        proposal absent     / disk absent       → allowed
        proposal explicit 0 / disk explicit 0   → allowed
        proposal absent     / disk explicit 0   → BLOCKED before the writer
        proposal explicit 0 / disk absent       → BLOCKED before the writer
  - 两个 mismatch 必须证明 writer 未启动：self.call_log() == []（0 次写调用）且
    stage 目标字节逐字节不变
  - allowed 两例不得退化为「一律 BLOCKED」：absent/absent 与 explicit0/explicit0 必须仍
    走到 writer 且成功（APPLIED_TO_STAGE），证明修复只收紧真正的语义漂移
  - place_component 的 rotation/mirror/unit presence 中性护栏：显式与省略在
    规范化后仍相等（该 op 的 writer 用 op.get(k, default)，presence 中性），
    防止本卡被「对称性」扩到 components.py
  - 失败类别与 reason code 相对修前不变：两个 mismatch 落 REPAIR_INPUT_DRIFT / PRECHECK，
    不引入新码、不改既有码语义
  - tests.test_akcli_adapter 全绿；全量 discover 不回归；dev_gate 带本 envelope 通过
  - 反向对照（证伪）：在未修的代码上，两个 mismatch case 必须红（即修复前它们是
    被放行的）——如实记录，不得只跑修复后
  - 纵向 probe（只读/测试层面）：raw proposal → C1 parse → C4 comparison → writer
    semantics，明确记录 C1 的 _parse_op 会不会提前把 absent 变成 explicit 0；若 probe
    证明 C1 会破坏最终执行语义，STOP → 单独报告 integration finding → 请求扩 scope/新卡，
    不得顺手改 C1（tools/repair_pipeline.py 为 forbidden）
  - 台账 + HANDOFF 如实追加；状态 PENDING_HUMAN_REVIEW

