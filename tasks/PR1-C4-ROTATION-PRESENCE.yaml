# 来源：Issue #86 [FINDING][P0] C4 INPUT-DRIFT — add_net_label rotation presence is
#       erased by normalization but remains execution-semantic to the pinned writer.
# Owner grant（人类，APPROVED）：GH-86#issuecomment-5778545662
#   scope 可以 grant；独立 C4 envelope；不扩到 place_component；contract_change=false；
#   四种 presence case + mismatch writer-zero-call + bytes unchanged；
#   admission 返回 ADMIT 之前不得修改 tools/akcli_adapter.py 任何一行。
# 实施顺序前置：#87 M1 已 merge（master bb38da1），本卡从 master d282c0b 起。
# 先例：tasks/PR1-C4-PRECHECK.yaml（同类 C4 execution-semantics fix，同 allow_dirty/allow_drift 形态）。

task: PR1-C4-ROTATION-PRESENCE

base:
  branch: fix-pr1-c4-rotation-presence
  sha: d282c0bfdd2174e5c159a57a8e1ed4f65db37ebc

goal: |
  修复 C4 adapter 的一处执行语义缺陷：PRECHECK 只比较「规范化后」的 operation，
  而 _normalize_operation 的 add_net_label 分支无条件返回 "rotation": 0，
  把「rotation 键是否存在」这一信息抹掉。

  缺陷事实链（tools/akcli_adapter.py，当前 master d282c0b）：
  - :968-975 add_net_label 规范化无条件 "rotation": 0，且 row.get("rotation", 0) != 0
    只校验值，不校验存在性 ⇒ absent 与 explicit 0 规范化后逐字段相等。
  - :1119-1130 PRECHECK 把 proposal 与 on-disk op-list 两侧都过同一个抹除函数再比较
    ⇒ absent 与 explicit 0 被判「相同」，放行。
  - :1154-1155 / :1201-1209 STRICT 执行的是原始 oplist_path（规范化从不参与执行）。
  - pinned writer 依据 akcli/writers/handlers/labels.py:78-88（AKCLI_VERSION 0.21.0，
    AKCLI_UPSTREAM_COMMIT 68c2df5e...）：
        if "rotation" in op:   orientation = int(op["rotation"])
        elif pin is not None:  orientation = geometry.label_angle_away(...)
    适配器强制 REF.PIN 锚点（_REFERENCE_PIN），故 pin 恒存在 ⇒ 省略走派生分支，
    显式 0 走 0。两个「规范化等价」的 op 写出不同角度。

  违反的不变量：PRECHECK 判定为相同的 authorized operation，必须具有相同的 writer
  execution semantics。这是「规范化等价 ≠ 执行等价」，不是格式洁癖。

  修法（Owner 指定，约 3 行，纯比较侧）：把 presence 编码进被比较的值，例如
  rotation_mode = "EXPLICIT_0" if "rotation" in row else "DERIVED_FROM_PIN"，
  与 "rotation": 0 并列返回。该产物只用于 PRECHECK 两侧比较与 len(proposed)，
  从不交给 writer（STRICT 用 oplist_path，EXCEPTION 用 on_disk）⇒ 只改变相等关系，
  不改变外部 Operation/proposal/op-list schema。

  本卡只修 add_net_label.rotation。place_component 的 rotation/mirror/unit 明确排除：
  pinned writers/handlers/components.py:41-43 用 op.get(k, default)，其 default
  （0 / "none" / 1）与 adapter 规范化值一致 ⇒ presence 在执行语义上中性。不按「对称性」扩范围。

