        已允许两种输入形状）；place_component 合同文本不变。
  - R1：absent 在 ops / oplist / to_dict() 及序列化往返后**仍无** rotation；explicit 0 始终保留。
  - R2：两者 Proposal digest 不同；raw_sha256 口径不变；HostPatch 正确绑定相应 proposal / proposal_sha256。
  - N2：旧断言按**合同修订**拆分，不是「重签 fixture」（该测试无冻结 hash 字面量）：
        ① rotation presence 使两 digest 不等；② scope absent/explicit local 仍相等；
        ③ place_component 省略与显式默认值仍相等。
  - N1(负)：非零 / null / bool / 字符串等非法 rotation；非 local scope；注入 public rotation_mode 均继续拒绝。

  **B. 完整传递路径（R3 / R3− / P1 / P2）**
  - R3：必须走完整路径并逐段证明 presence 未被再次丢弃：
        raw Proposal → parse_proposal() → to_dict() → HostPatch.proposal / proposal_sha256
        → 序列化并重读 stage op-list → C4 PRECHECK → writer 输入语义；
        两端分别到达 DERIVED_FROM_PIN / EXPLICIT_0。
        测试中的 HostPatch 与 op-list **必须由 C1 解析结果构造**，不得用 raw 数据重新拼装绕过缺陷。
  - R3−(负)：两个方向的 proposal/disk presence mismatch 均在 PRECHECK 阻断，writer 调用 0 次，stage 字节不变。
  - P1(正)：固定 rotation presence，scope absent / explicit local 的 parsed shape、digest、C4 comparison 相等。
  - P2(正)：place_component 的 rotation/mirror/unit 分别及组合省略，与显式默认值等价。

