task: PR1-C4-P2P8

base:
  branch: feat-pr1-c4-p2-p8
  sha: 0626375cb5a0893a6b940ed6c8d41d5784882dac

goal: |
  把 B5 判据 §C4 的 C4-P2..P8 从「桩层语义相近 / 未跑」推进到**逐条可复现的 qualification**，
  每条如实标注证据等级（native / stub-level / NOT_RUN），并给出 expectations 的落点。
  C4-P1 已在 PR #76 完成；本卡不重开 P1。

  本卡是**验收侧**卡片：不得修改被验对象。`tools/**`、`gates/**` 为 forbidden。
  若 qualification 暴露 adapter 缺陷：STOP → 记 BLOCKED → 升级 Owner。

  开工探针（2026-09-17，真 akcli 0.21.0 + 真 DC-04 资格夹具，scratch 副本）已确定
  每条的可行性，结论如下（原始回执已留 host 侧）：

  - **C4-P5 native 可行**：`add_net_label name=GND at=U1.6`（U1.6 是 DC-04 的 no_connect 脚，
    原属未命名网络）在**干净**夹具上触发真 writer 合法拒绝：
    exit=6 / `error.code=OPLIST` / "REFUSED: --strict-nets: net split/merge touches a named
    net; nothing written" / 字节零变化。这是 pre-write 拒绝，可直接验证「strict 被拒后不得
    自动改走 exception」以及「一次写调用」。
  - **C4-P6 native 可行**：真工具运行 + 宿主 manifest 的 `symbol_digest` 被扰动 →
    `TOOL_ERROR / REPAIR_TOOL_UNAVAILABLE`；`akcli_version` 被扰动 → `toolchain_manifest`
    在**任何写调用之前**拒绝（BLOCKED，写调用数 0）。
  - **C4-P7 native 可行**：单批 3 op = 1 次写调用且 `APPLIED_TO_STAGE`；把 DC-04 拆成
    [place_component] + [两个 add_net_label] 两批时，第 1 批单独作废（字节已变且 net_diff 报
    `+ NEW <unnamed@R9.1/R9.2>`），第 2 批被真 writer 拒绝 —— 拆批与单批**不等价**。
    另在桩层验证「一次携带两批的 op-list 容器」被拒（input drift）。
  - **C4-P8 native 不可行（本卡最重要的负面结论）**：真 writer 能产生连通性 finding 的形态
    （悬空 wire；把 no_connect 脚真正 wire 起来）都需要 Operation v1 之外的 op，adapter 会在
    **词表**处即拒（0 次写调用）—— 按判据 §1 规则 2 与 §C4「假红示例」，这是**假红**，
    不能算 P8 的资格。且实测 v1 的 `add_net_label` 打在被 no_connect 的脚上
    （J1.A8 / U1.5）后，**fresh read 与回执的 connectivity 均为 0 条 finding**。
    故 P8 只能停在 stub-level，native 记 `NOT_RUN` 并升级 Owner（属夹具/词表边界，不是缺陷）。
  - **C4-P3 不可行**：走 API 路径需要 E1/E2/E3 原生夹具，仓库只有 DC-01..DC-05
    （op-list 形态）。按卡内约束**不自行造夹具** → `NOT_RUN` + 升级 Owner。
  - **C4-P2 / C4-P4**：真 writer 在成功路径恒返回 `applied=true` 且 op_results 完整，
    无法从真工具观测到「字段缺失 / 伪造 true / op 缺项 / 重复 index」→ 桩层固定，
    测试名与文档明确标注 stub-level，绝不写成原生资格。

