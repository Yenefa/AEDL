acceptance: |
  - C4-P5 native：真 writer 对 `add_net_label name=GND at=U1.6` 返回合法拒绝（exit 6 /
    error.code=OPLIST）→ adapter `BLOCKED` / `REPAIR_STRICT_REFUSED`；且**写调用恰好 1 次、
    exception writer 调用 0 次**（strict 被拒不得 fallback 到 exception）
  - C4-P6 native：真工具 + 被扰动的 symbol_digest → `TOOL_ERROR / REPAIR_TOOL_UNAVAILABLE`；
    被扰动的 akcli_version → 在写调用之前即拒（BLOCKED，写调用 0 次），不得静默继续
  - C4-P7 native：单批 3 op → `APPLIED_TO_STAGE` 且写调用恰好 1 次；拆成两批时真 writer
    对第 2 批合法拒绝、且拆批后的中间态与单批结果**不等价**（net_diff 出现新的未命名网络）
  - C4-P7 桩层：一次携带两批的 op-list 容器被拒（input drift，写调用 0 次）
  - C4-P2 桩层：`applied` 缺失 / `false` / JSON 层伪造 `true`（含伪造 `authorized=true`）
    → 绝不 `APPLIED_TO_STAGE`；桩层结果用测试名/文档标注 stub-level
  - C4-P4 桩层：`op_results` 缺项 / 重复 index / 任一 `status=error` → `BLOCKED`，
    且必须逐一覆盖 0..n-1 且全 ok 才可能通过
  - C4-P8 桩层：新增 WARNING / 任何 NO_CONNECT_CONFLICT / 回执与 fresh read 分项矛盾 → 阻断；
    并如实记录「P8 无合法原生路径（词表假红）」的探针证据
  - C4-P3：`NOT_RUN`（缺 E1/E2/E3 原生夹具，不自行造）并升级 Owner
  - 每条 qualification 给出判据 §3 的 verdict 字段；native 与 stub-level 严格区分，
    绝不把 stub 结果写成原生资格；不得为通过而放宽断言或改判据
  - 未 opt-in 时原生类 SKIP 并如实标注；opt-in 后缺工具/坏版本必须 FAIL 不得 SKIP
  - tests.test_akcli_adapter 全绿；全量 discover 不回归；dev_gate 带本 envelope 通过；
    反向对照证明新增原生用例在未修的桩/真工具边界上确实会红
  - 台账 + HANDOFF 如实追加；状态 PENDING_HUMAN_REVIEW

