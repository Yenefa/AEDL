# Task Envelope — PR1-C4-P2P8  C4-P2..P8 Native Perturbation Qualification
# 判据唯一来源：notes/b5-acceptance/C3-C6_PERTURBATION_CRITERIA_DRAFT.md §C4（draft-4，冻结；
# 本卡只读，不改写、不反向照着实现改判据）。
# 先例：tasks/PR1-C4-PQ.yaml（C4-P1）、tasks/PR1-C4-UUIDS.yaml。
#
