    decision_ref: "Yenefa 2026-09-27 会话指令「继续」—— 在被明确告知 P1 与 EVID-DC04 envelope 的 scope/acceptance 冲突、并给出新建 envelope 的推荐路径后"
  allow_drift:
    granted_by: Yenefa
    decision_ref: "Yenefa 2026-09-27 会话指令「继续」，同上；drift 仅由本任务的 envelope / bookkeeping 提交产生"

