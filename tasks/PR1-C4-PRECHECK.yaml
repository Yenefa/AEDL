# Task Envelope — PR1-C4-PRECHECK  C4 toolchain binding must be settled in PRECHECK
# 依据：PR-1 实现合同 §7 状态机（`docs/competition/internal/AEDL_PR1_实现合同_20260907.md` L355/L369）
# —— Phase 固定 `PRECHECK → SNAPSHOT → STAGE_APPLY → …`；PRECHECK 的职责明确包含
# 「校验 Proposal/context/path/file manifest/**toolchain**；native before 全量读取」，
# 而 native write 属 STAGE_APPLY 且**只调用一次**。因此凡是能由 (manifest + native before)
# 定案的 toolchain 身份属性，都必须在任何 writer 启动之前定案。
#
# 来源：PR #78 的 C4-P2..P8 qualification 发现的**真实缺陷**（Owner 2026-09-17 裁定
# 「真实 C4 缺陷，必须单独 implementation fix，#78 暂停」）。
# 先例：tasks/PR1-C4.yaml / PR1-C4-PQ.yaml / PR1-C4-UUIDS.yaml / PR1-C4-P2P8.yaml。

task: PR1-C4-PRECHECK

base:
  branch: fix-pr1-c4-precheck-binding
  sha: 0626375cb5a0893a6b940ed6c8d41d5784882dac

goal: |
  修复 C4 adapter 的一处**顺序缺陷**：symbol digest / 运行中 akcli 身份与实际安装分布
  digest 的校验目前发生在 `_verify_effect()`，即 **native writer 已经执行之后**；
  而 `akcli_version` 失配在同一实现里却是**写前**拒绝。两者安全等级不一致，且违反合同
  §7「PRECHECK 校验 toolchain，写属 STAGE_APPLY」。

  缺陷证据（PR #78 的 C4-P6 native 用例，真 akcli 0.21.0）：
  扰动宿主 manifest 的 `symbol_digest` 后，真实 native write 仍被执行：
  `tool.exit_code = 0`、stage 字节已被改写，**之后**才由 `_verify_effect()` 判
  `TOOL_ERROR / REPAIR_TOOL_UNAVAILABLE`。即「在已知 toolchain 不匹配的情况下先写一刀」。

  修法（Owner 指定，最小面）：
  `native_before` PASS 之后、`_execute_route()` 之前，立即比较
  `akcli version` / 已安装分布 digest / `symbol_digest`，全部匹配才允许启动 writer；
  任一不匹配 → `TOOL_ERROR / REPAIR_TOOL_UNAVAILABLE`，**native write 调用数 = 0**、
  stage 字节不变。
  保留在 `_verify_effect()` 的只有**本质上只能跨两次读才能观测**的那一条：
  已安装分布 digest 在 before/after 两次读之间发生变化。

  本卡**不改判据**（B5 §C4 冻结）、不改 `gates/**`、不改公共契约语义；
  也不动 PR #78 的 grading —— #78 在本卡 merge 后 rebase 再更新。

scope: |
  Writable paths are whitelisted in allowed_paths; everything else is FOREIGN.
  只改 `tools/akcli_adapter.py` 的校验顺序与 `tests/test_akcli_adapter.py` 的对应回归；
  不改 `gates/**`、`src/**`、`sandbox_runtime/**`、`tools/repair_pipeline.py`、
  `notes/b5-acceptance/**`（冻结判据）、`docs/competition/**`、`docs/evidence/**`、
  `tests/fixtures/repair_pr1/**`。

  Impact Analysis

  Direct modifications:   tools/akcli_adapter.py（新增 PRECHECK 绑定校验 helper；
                          `_verify_effect()` 移除已前移的三条比较）、
                          tests/test_akcli_adapter.py、tasks/PR1-C4-PRECHECK.yaml、
                          docs/HANDOFF.md、docs/compliance/ai-usage/<ID>.md、AI_USAGE_LOG.md
  Potentially affected:   C4-P6 的 native qualification（#78 需 rebase 并改断言：
                          exit_code==0 不再成立，改为写调用 0 次 + 字节不变）；
                          exception 路由同样受益（CONSTRAINED_EXCEPTION 也在写前定案）
  Explicitly not touched: gates/**、src/**、sandbox_runtime/**、tools/repair_pipeline.py、
                          notes/**、docs/evidence/**、tests/fixtures/repair_pr1/**
  Risk: LOW-MEDIUM（校验前移，失败类别与 reason code 不变；只会让更多失败在写前发生）

  change_budget:
    expected_files: 6
    expected_modules: [tools, tests, tasks, docs]
    cross_module: false
    contract_change: false
    evidence_semantics_change: false

dependencies: []

allowed_paths:
  - tools/akcli_adapter.py
  - tests/test_akcli_adapter.py
  - tasks/PR1-C4-PRECHECK.yaml
  - docs/HANDOFF.md
  - docs/compliance/AI_USAGE_LOG.md
  - docs/compliance/ai-usage/**

forbidden_paths:
  - gates/**
  - tools/repair_pipeline.py
  - src/**
  - sandbox_runtime/**
  - notes/**
  - docs/competition/**
  - docs/evidence/**
  - tests/fixtures/repair_pr1/**

acceptance: |
  - 桩层：`symbol_digest` / 已安装分布 digest / 运行中版本失配时，`apply_stage` 仍在
    **任何 strict 写调用之前**拒绝（`TOOL_ERROR` / `REPAIR_TOOL_UNAVAILABLE`），
    且 `call_log()` 为空（0 次 writer 调用），stage 字节不变
  - 原生：真 akcli 0.21.0 + 扰动 `symbol_digest` → 拒绝且**写调用 0 次**、stage 字节
    逐字节不变（此前为 exit_code=0 且字节已改）
  - 正常路径不回归：DC-04/DC-05 真原生仍 `APPLIED_TO_STAGE` 且 before/after 字节与独立
    复现一致；异常路由（CONSTRAINED_EXCEPTION 桩）仍 `APPLIED_TO_STAGE`
  - 保留跨读检查：已安装分布 digest 在 before/after 两次 native 读之间变化仍 →
    `TOOL_ERROR` / `REPAIR_TOOL_UNAVAILABLE`（该条本质上无法前移，须有回归）
  - 失败类别与 reason code 相对修前**不变**（只有发生时点前移），不得借前移放宽或改码
  - tests.test_akcli_adapter 全绿；全量 discover 不回归；dev_gate 带本 envelope 通过
  - 台账 + HANDOFF 如实追加；状态 PENDING_HUMAN_REVIEW

