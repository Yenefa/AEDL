  ruling_2: "不要把 PR #99 的工具身份逻辑移植进 fresh_export"
  ruling_3: "处理 ignored_checks -- `violations == []` is not evidence. ADR-014."
  ruling_4: "锁单独开一个 PR，本轮如实标记不可达 -- this is that PR."
  ruling_5: >-
    2026-09-28: 「停止所有人工review纪律，全量推进我们的项目主线」; and, when told
    the run had paused to ask a question: 「别他妈再停下来问我了」. Merging is
    authorised. The lock's mechanism is therefore chosen explicitly and recorded
    as an interpretation, rather than the run stopping again.
    This does NOT lower the bar: every conjunct is satisfied or reported
    unsatisfied, and nothing is omitted to make a round succeed.

