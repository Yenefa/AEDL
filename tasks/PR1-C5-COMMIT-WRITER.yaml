acceptance: |
  - The lock is taken before any write and released after. A test asserts a second
    acquisition from another handle is REFUSED while the first is held, and
    succeeds after release. On Windows this is `msvcrt.locking(LK_NBLCK)`; the
    test is skipped, not silently passed, if no primitive is available.
  - The lock anchor's bytes never change and the file is never deleted.
    `test_the_anchor_is_fixed_content_and_survives_release` asserts both.
  - If no OS locking primitive is available, the round REFUSES. There is no
    in-process fallback, and a test asserts the refusal rather than the absence
    of an exception.
  - `COMMIT_INTENT` is durable and fsync'd BEFORE the design is written, and
    carries the verified staged hash. A fault-injection test interrupts between
    the INTENT and the replace and asserts the INTENT is on disk with that hash.
  - A torn final journal line -- the normal artefact of a crash mid-append -- is
    reported as a tear and fails closed, per contract 387. A reader that skipped
    it would conclude the round never committed.
  - The design write is temp-in-the-same-directory, O_EXCL, flush, fsync,
    `os.replace`. Tested: no temp file survives a successful write; a leftover
    temp from a crashed prior process is never silently clobbered; a fault
    before the replace leaves the candidate design byte-identical to its
    snapshot.
  - After the replace, the final design is verified byte for byte AND by hash.
    Corrupting the bytes between replace and verify must refuse, not COMMITTED.
  - The terminal record is written BEFORE COMMITTED is published. Interrupting
    between the replace and the terminal record must not yield COMMITTED.
  - The restore implements contract 385's three branches and is driven from the
    journal at PRECHECK:
      live == recorded before  -> rule 1: confirm against the snapshot manifest,
                                  `rollback.status = VERIFIED`, no rewrite;
      live == recorded after   -> rule 2: restore the snapshot's bytes via
                                  temp -> fsync -> replace, then byte + hash +
                                  file-set compare, only then VERIFIED;
      live == neither          -> rule 3: QUARANTINE. `UNKNOWN`, no overwrite,
                                  no next round. Never guess.
    Each branch has its own test, and each writes a TERMINAL record.
  - `rollback.status = "VERIFIED"` is published ONLY alongside a real comparison.
    Contract 384: VERIFIED is earned, not asserted.
  - `commit` keeps contract 404's closed shape: `attempted`, `replaced`,
    `verified`, reflecting what HAPPENED rather than what was intended.
  - A committed round projects `APPLIED_TO_CANDIDATE`, and COMMITTED is the only
    status that does. The existing test for that is extended to a real committed
    round rather than only the mapping function.
  - Contract 378: at COMMIT the candidate root is re-resolved with `strict=True`,
    every path component is checked for a symlink or reparse point, and each
    file's link count is read. A high link count REFUSES rather than warns.
  - The one-write-call conjunct is satisfied by a counter at the single
    `apply_stage` call site, asserted to be exactly 1. `akcli_adapter` is not
    modified.
  - `run_round` never raises for any verdict. The PR1-C5-COMMIT draft had a
    NameError, a missing `hashlib` import and a non-existent keyword argument,
    all escaping `run_round` instead of refusing.
  - The full suite stays green, every new test is mutation-verified, and
    `py -3 -m tools.dev_gate --envelope tasks/PR1-C5-COMMIT-WRITER.yaml` exits 0.
  - Windows-specific: a file held open by another process without
    `FILE_SHARE_DELETE` makes `os.replace` raise `PermissionError`. That is a
    refusal with a named cause, not an unhandled exception, and not a silent
    retry loop.

