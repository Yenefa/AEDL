task: PR1-C5-COMMIT-WRITER

base:
  branch: feat/c5-commit-writer
  sha: 3b66ac5

goal: |
  Make the round promotable: the single-writer lock, the restore, and the
  COMMIT writer, landing TOGETHER.

  PR #101 landed the predicate and the journal read path and proved, from an
  adversarial review of its own first draft, that the writing half cannot ship
  alone:

    "If restore is not in this increment, then step 2 must not run either -- a
     durable INTENT with no restore is strictly worse than no commit."

  Contract 387 requires a RESTORE for a transaction holding a COMMIT_INTENT and
  no terminal record ("无 COMMITTED terminal record 的事务，即使有 COMMIT_INTENT
  且 live=after，也按第2条恢复；不猜测这次已经成功"), and 385 makes that restore a
  write from the snapshot via temp -> fsync -> replace. Contract 346 makes the
  single-writer lock a conjunct of the predicate.

  So this increment adds, in one change:
    * the single-writer lock (contract 346, 369, 376);
    * the journal WRITE path -- COMMIT_INTENT and TERMINAL (contract 374, 390);
    * the atomic design replace (contract 374, and 385 reuses it);
    * the restore and the three-branch recovery of contract 384/385/386, driven
      from the journal at PRECHECK (contract 369);
    * the COMMIT phase itself, ending in a terminal COMMITTED;
    * the one-write-call count of contract 339, counted at the single pipeline
      call site rather than by changing the adapter;
    * contract 378's per-component re-resolution and file link-count check at
      COMMIT.

  Owner rulings, 2026-09-28:
    4. "锁单独开一个 PR" -- the lock is its own PR. This is it.
    5. "停止所有人工review纪律，全量推进" and, when asked whether to stop and ask
       again: do not. So the lock's mechanism, which the contract does not pin
       down, is chosen explicitly below, stated as an interpretation, and made
       FAIL-CLOSED rather than guessed at silently.

  THE INTERPRETATION, stated plainly because it is a safety boundary.
  Contract 376 says the lock file is "内容固定、不因 unlock 删除" -- fixed content,
  not deleted on unlock. Fixed content plus never-deleted means the file's
  EXISTENCE cannot signal whether the lock is held, so the exclusion has to come
  from somewhere else. This increment reads it as:

    * `<candidate>/.repair.lock` is a fixed-content ANCHOR. It is created once,
      its bytes never change, and it is never deleted. (Contract 376, satisfied
      literally.)
    * EXCLUSION is an OS byte-range lock taken on that anchor for the lifetime of
      the transaction. The OS releases it when the process dies, so a crash
      cannot leave a stale lock -- which is what makes contract 390's guarantee
      boundary ("进程异常/可检测 I/O 故障与重启恢复") true without inventing a
      power-loss claim the contract explicitly forbids.
    * If the lock cannot be acquired, or no OS locking primitive is available,
      the round REFUSES. It never proceeds on the assumption that it holds one.

  Windows uses `msvcrt.locking(LK_NBLCK)`; POSIX uses `fcntl.flock`. Both are
  non-blocking. There is no third path and no in-process fallback, because a
  fallback that cannot exclude another process is not a lock.

scope: |
  In scope:
  - tools/repair_pipeline.py:
      * `_SingleWriterLock` -- acquire / hold / release, non-blocking, fail-closed.
      * `_write_journal_record` -- append + flush + fsync, closed field set.
      * `_atomic_replace_file` -- temp in the SAME directory (O_EXCL, never
        clobbering a leftover), write, flush, fsync, `os.replace`.
      * `_recover_incomplete` -- the three branches of contract 384/385/386,
        driven by the journal, writing a TERMINAL record for what it resolved.
      * `run_round`: acquire the lock at PRECHECK, recover before anything else,
        then COMMIT -- predicate, INTENT, read stage bytes, atomic replace,
        post-verify byte AND hash, terminal record, and only then COMMITTED.
      * the one-write-call count, incremented at the single `apply_stage` call
        site, which is where the pipeline knows the answer. `akcli_adapter` is
        NOT modified.
      * contract 378's per-component link / reparse / link-count check at COMMIT.
  - tests/test_repair_pipeline.py: `CommitWriterTests`, `SingleWriterLockTests`,
    `RecoveryTests`.
  - tasks/PR1-C5-COMMIT-WRITER.yaml
  - docs/compliance/ai-usage/**, docs/compliance/AI_USAGE_LOG.md
  - docs/compliance/DECISIONS.md -- one ADR for the lock interpretation, because
    it is a safety boundary and the contract does not settle it.

  Out of scope, explicitly:
  - **No ERC / DRC / render / evidence work.** `docs/evidence/**` frozen.
  - **No NO_CHANGE idempotent replay** (contract 392). The predicate machinery
    exists; the `(run_id, candidate_id, patch_id)` key index does not, and it is
    a separate increment.
  - **No `CandidateWorkspace.candidate_hash` finalisation** (contract 414), and no
    `.actions.jsonl` write. The finalisation depends on the final receipt shape
    being settled, which NO_CHANGE would change.
  - **No change to `gates/**`.** `verify_stage`, `write_thin_verification`,
    `recheck_reports` and `recheck_reports`'s report manifest are consumed as-is.
    Commit re-reads them; it does not re-run anything.
  - No `sandbox_runtime/**`, no `src/**`, no `tools/akcli_adapter.py`,
    `tools/host_toolchain.py`, `tools/board_review.py`, no `.github/**`.

