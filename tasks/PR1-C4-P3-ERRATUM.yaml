goal: |
  发布 **draft-5 acceptance erratum**，消除 C4-P3 判据与既有实现合同之间的直接矛盾。

  被验事实（本卡开工前实测）：
  - 合同 §8 规定 API/exception 路径没有 `applied` 字段，`tool_applied` 恒为 `null`；
    该路径的成功由**独立条件**判定（`op_results` 覆盖 `0..n-1` 且全 `ok`、字节真实改变、
    fresh reread 成功、connectivity 检查成立）。
  - 冻结判据 §C4 的 C4-P3 行写的是「不得当成成功」，把「缺少 `applied` 字段」本身
    当成了红 —— 这是把**设计使然的中性事实**误判为失败依据。

  正确语义（Owner 指定）：`tool_applied=null` **不得被当作 affirmative applied evidence**；
  CONSTRAINED_EXCEPTION 只有在上述独立条件**全部成立**时才可判 `APPLIED_TO_STAGE`。

  本卡**只做 erratum**，不做 native P3 qualification（后者须等本卡合入后再开卡，
  且用现有 DC-01/DC-02/DC-03 接 E1/E2/E3，**不新造 schematic fixture**）。

