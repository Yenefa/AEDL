# Owner 明确扩 Scope（2026-09-17 本会话）：只授权为修正**已确认的 C4-P3 判据与 PR-1 §8 的
# 语义冲突**，不是重新开放整份 B5 判据自由修改。
# 依据：PR-1 实现合同 §8 明确 CONSTRAINED_EXCEPTION / API 路径**本来就没有 `applied` 字段**
# （`tool_applied = null` 是设计使然），该路径仍可在独立条件全部成立时成功。
# 冻结判据 §C4 现写「走 API 路径且 tool.tool_applied=null → 不得当成成功」，与合同直接矛盾。
#
# 本卡 base 暂以 PR #79 head 为 base（#79 尚未合入 master），同 tasks/PR1-C4-PQ.yaml 先例；
# #79 合入后立即 rebase 到 master 再复评。
# 注意：base.sha `4ccafca` 是 **PR #79 的分支 head**，当前尚未出现在 master 上；
# base.branch 声明为本卡自身分支（admission 要求 base.branch == 当前分支）。

task: PR1-C4-P3-ERRATUM

base:
  branch: docs-pr1-c4-p3-erratum
