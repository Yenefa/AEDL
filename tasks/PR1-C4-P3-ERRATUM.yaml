# 已知审计风险（本卡**不**修，如实上报）
#
# 冻结 hash 是 **git blob（LF）** 字节的 sha256；而 `core.autocrlf=true` 且该文件在
# `.gitattributes` 中**没有**规则，所以 Windows 工作树检出为 CRLF，同一文件
# `Get-FileHash` 会得到**不同的**值（实测 21105 B / 0DB60076… vs 21312 B / D97DBF54…）。
# 后果：Windows 上的核验者若直接哈希工作树文件，会误以为冻结被破坏。
# 建议后续按 GH-20 的「LF byte baseline」给该文件加 `text eol=lf`；但 `.gitattributes`
# 不在本卡 allowed_paths 内，故本卡只记录该风险，不擅自扩大范围。
