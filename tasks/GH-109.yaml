acceptance: |
  - `python3 -S -m unittest discover -s tests` on WSL2 Ubuntu-24.04 is green.
    Measured BEFORE the fix: `Ran 1223 tests, FAILED (failures=1, skipped=29)`.
  - `uv run python -m unittest discover -s sandbox_runtime/tests -p "test_*.py"`
    on WSL2 Ubuntu-24.04 is green. Measured BEFORE the fix:
    `Ran 438 tests, FAILED (failures=2, errors=54, skipped=1)`.
  - The 54 `setUp` errors become EXECUTED ASSERTIONS THAT PASS. They were errors
    inside `setUp`, so the candidate-isolation guards were never reached on Linux;
    a fall from 56 to 0 that leaves them skipping does NOT satisfy this. No
    adversarial workspace test may skip for a NEW reason.
  - A mutation restoring the unconditional `st_nlink > 1` check is KILLED ON
    WINDOWS. The defect is invisible there, so a Windows-invisible green is
    worthless without this.
  - Every existing hard-link test (design file, ledger, `ledger_path`) still
    refuses with "hard link" in the message, on BOTH platforms. The fix narrows
    the check's POPULATION; it must not weaken it for files.
  - The Windows leg does not regress: full `python -m tools.dev_gate` green
    locally, sandbox >= 438 tests, main >= 1223 tests.
  - ADR-017 amended to record the POSIX `st_nlink` semantics and the resulting
    scoping of the check to non-directories.
  - `gates/**` and `docs/evidence/**` untouched.

known_limitations:
  - "The authoritative signal is a green `minimal-ci` run on the PR. That is
     NOT_RUN from this machine and is left to the runner."
  - "Local Linux verification is WSL2 Ubuntu-24.04: the sandbox leg is pinned to
     Python 3.11 by uv, exactly as CI pins it, so that leg is faithful. The MAIN
     leg runs Python 3.12 locally where CI uses 3.9, so a green local main leg is
     strong but not byte-identical to CI. Stated rather than assumed away."
  - "The sandbox suite is run from a /mnt/c path, which is a DrvFs mount rather than
     a native Linux filesystem. `st_nlink` and symlink resolution behave with POSIX
     semantics there, which is what made the reproduction valid, but it is a
     difference from the runner and is recorded rather than glossed."
  - "The WSL2 run and the Windows run SHARE `sandbox_runtime/.venv` through the
     DrvFs mount, and this was measured rather than assumed: the Linux `uv` wrote
     a POSIX `lib64` symlink into the Windows venv, after which the Windows `uv`
     failed with `error: failed to remove file ...\\.venv\\lib64: access denied`
     until the link was removed with `cmd /c rmdir`. The Windows venv is a
     gitignored build artefact and no tracked file was affected, but a future
     cross-platform run should point `UV_PROJECT_ENVIRONMENT` at a per-platform
     path instead of letting the two share one."

change_budget:
  expected_files: 7
  expected_modules: [sandbox-workspace, main-tests, tasks, compliance]
  cross_module: true
  contract_change: false
  evidence_semantics_change: false
  # expected_files was WRITTEN as 6 by an arithmetic slip, against 7 allowed
  # paths that the same envelope enumerates above. Measured at HEAD: 7 files
  # changed vs base.sha, all in scope, none forbidden, no module added, and no
  # boolean flipped. Corrected to the measured number rather than left to read as
  # an overrun it is not.

scope_amendment:
  - id: A1
    path: sandbox_runtime/tests/orchestrator/test_workspace.py
    adds: "os.unlink for a symlink, os.rmdir for a junction, when removing the link this test plants"
    reason: |
      This is a third defect, and it was MASKED by defect 1 rather than found
      independently. `test_a_junction_inside_a_candidate_refuses_its_content_hash`
      asserts that `candidate_hash` REFUSES a candidate containing a link, and
      that refusal happened inside `setUp` -- so on Linux the test errored before
      `candidate_hash` ever hashed anything, and the `os.rmdir` on line 394 was
      never reached. It has therefore never executed on Linux for as long as
      defect 1 existed.

      Fixing defect 1 is what made it visible: the acceptance criterion for this
      task is that the 54 `setUp` errors become EXECUTED ASSERTIONS THAT PASS, and
      that criterion cannot be met while this line raises `ENOTDIR`. The amendment
      is a consequence of the fix, not a substitute for it.

      It is the same class as defect 2 -- a Windows-only assumption in a test that
      Windows cannot fail. `_junction` builds a symlink wherever symlinks are
      available and a junction only where they are not, so the correct removal is
      not portable and the original author's `os.rmdir` (correct, and measured, for
      the Windows junction) is wrong for the symlink case.

      Why this is not ordinary scope creep: the file is already in `allowed_paths`,
      `expected_files` does not change, no `change_budget` boolean flips, and no
      production code is touched. It is also the ONLY amendment, and the
      "any further defect" line above stays in force -- a red leg after this is a
      new issue.

      Recorded here rather than made silently, and the Owner was asked before it
      was taken.
    authority: "Owner session 2026-09-29 「继续」, given the amendment was put to them first"
    issues_if_rejected: >-
      If a reviewer rejects A1, the fix is a 4-line revert and the linux leg goes
      red again with exactly one error. Nothing else in this envelope depends on it.

exceptions:
  # Both grants below cover ONE thing only: this envelope's own commit. A new
  # envelope is a dirty entry until it is committed, and committing it moves HEAD
  # off base.sha, so admitting a freshly-opened task is impossible without these.
  # That is the whole extent of them.
  #
  # Neither is used to reach around a real baseline conflict. If master moves, or
  # if a second dirty path appears, that needs its own Owner decision -- not these.
  #
  # NOTE: the envelope parser is line-based and reads `key: value` on a single
  # line, so the reasoning lives in these comments rather than in `reason` /
  # `decision_ref`, which must stay one line each.
  allow_dirty:
    permitted: true
    reason: "this envelope's own commit only; a second dirty path is not covered"
    authority: task-envelope
  allow_drift:
    granted_by: Yenefa
    decision_ref: "PR #108 report 2026-09-29 「建议另立任务修复」 + Owner session 「继续推进可以推进的」"

