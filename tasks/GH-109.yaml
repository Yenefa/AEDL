task: GH-109

base:
  branch: fix/linux-nlink-and-cmd-probe
  sha: c6d52d97333e1d7ae79853f2ba395bb02c5d7047

goal: |
  Make the `linux` leg of `minimal-ci` pass on `master` by fixing the two platform
  bugs that PR #108 measured, reproduced, and recommended fixing in a separate
  task. This is that separate task.

  The red is pre-existing `master` code, not something PR #108 introduced -- but
  a green linux leg is the only usable verification signal this project currently
  lacks, so it is worth doing on its own merits.

  Defect 1 (56 of the 57 linux failures): `_ensure_within` in
  `sandbox_runtime/src/aedl_sandbox/workspace.py` refuses any path with
  `st_nlink > 1`. On POSIX a DIRECTORY's `st_nlink` is `2 + subdirectory count`,
  not an alias count, so every directory is refused and `create_candidate` fails on
  its first operation. Windows does not report directory link counts, so the same
  code passes there and the defect is invisible on the platform it was written on.

  Defect 2 (the 57th): `test_control_plane_tools.py` probes for "a non-interpreter"
  with `["cmd", "/c", "exit 3"]`. `cmd` is not on PATH on Linux, so the correctly
  named refusal does not contain "exit code 3" and the assertion fails. The TOOL is
  right; the TEST carries the platform assumption.

scope: |
  In scope:
  - `sandbox_runtime/src/aedl_sandbox/workspace.py`
      * `_ensure_within` applies the `st_nlink` check to NON-DIRECTORIES only.
      * the docstring says WHY a directory's `st_nlink` is not evidence of
        aliasing, with the POSIX rule named, so the next reader does not
        "simplify" the guard away.
  - `sandbox_runtime/tests/orchestrator/test_workspace.py`
      * a regression test that fails ON WINDOWS if the check is re-broadened to
        directories, because Windows cannot see this defect natively. Without it a
        Windows green proves nothing about the fix.
      * **SCOPE AMENDMENT (see the amendment block at the end of this envelope):**
        the planted link is removed with `os.unlink` when `_junction` produced a
        symlink, and `os.rmdir` when it produced a Windows junction. Added because
        this acceptance criterion -- that the 54 `setUp` errors become EXECUTED
        assertions that pass -- cannot be satisfied while this line fails.
  - `tests/test_control_plane_tools.py`
      * the non-interpreter probe is chosen for the running platform. The
        assertion ("exit code 3" must be named) is NOT weakened.
  - `tasks/GH-109.yaml`
  - `docs/compliance/ai-usage/**`, `docs/compliance/AI_USAGE_LOG.md`
  - `docs/compliance/DECISIONS.md` (amend ADR-017 with the POSIX semantics)

  Out of scope, explicitly:
  - `tools/dev_gate.py` and everything else under `tools/**`. `probe_interpreter`
    behaves correctly; the defect is in the test's platform assumption. Changing
    the tool to satisfy a wrong test is the wrong direction.
  - `.github/**`. The Verification Policy, the required test set, the secret scan,
    the runner environment and the skip conditions are all untouched, so the
    two-owner GH-20 confirmation in `ci.yml` is NOT triggered.
  - `gates/**`, `docs/evidence/**`, `src/**`, `delivery/**`, `notes/**`.
  - Any `sandbox_runtime/**` file other than the two named above.
  - Any `tests/**` file other than `tests/test_control_plane_tools.py`.
  - The `5b2556b` commit on `fix/dev-gate-interpreter`, which stays with the Owner.
  - **Any further defect.** This envelope originally promised that a red leg after
    these fixes would become a NEW issue rather than a widened scope. That promise
    was kept for every defect EXCEPT the one this amendment names, which was
    masked by defect 1 and could not be observed until defect 1 was fixed. A
    further defect appearing now is a new issue; this line is not being relaxed
    twice.

