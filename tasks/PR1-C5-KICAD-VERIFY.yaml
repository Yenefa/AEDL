task: PR1-C5-KICAD-VERIFY

base:
  branch: feat/c5-kicad-verify
  sha: e1724d4

goal: |
  Make the transaction state, for the first time, exactly what it verified.

  KICAD_VERIFY is an EVIDENCE GENERATOR, not a gate. Owner ruling, and the
  reason is measured rather than stylistic: on the DC-04 fixture, kicad-cli
  10.0.5 reports ZERO ERC errors on the DEFECTIVE board. 37 warnings are raised
  and every one is lib_symbol_issues or footprint_link_issues -- library
  resolution, not electrical. So a gate written as `erc_error_count == 0` is
  already green on a broken board, and `--exit-code-violations` returns 5 for
  reasons that have nothing to do with the design.

  A verification tool's output is not a correctness proof, and this phase's
  deliverable is the first artifact in the system that says so in its own
  fields.

  What the phase produces, per the frozen design:

    ToolIdentity   resolved_path, version, measured_sha256, declared_sha256,
                   status MATCH | SUBSTITUTION | UNAVAILABLE
    ERC            severity totals AND by_type breakdown, plus kicad_version
    Netlist        raw_sha256 + content_sha256 + the normalisation spec
    Render         inventory of what the tool ACTUALLY produced
    Limitations    the DC-04 detection result, in the artifact

  Owner rulings, all eight, recorded verbatim in the design section below and
  implemented as stated.

scope: |
  In scope:
  - tools/repair_pipeline.py:
      * a verification EVIDENCE BUILDER that runs kicad-cli from the bound
        executable and records what happened;
      * tool identity resolved ONLY from the toolchain binding, measured and
        compared against the declared digest. No find_kicad_cli() fallback --
        that function reads KICAD_CLI, then PATH, then a hardcoded path
        belonging to a different user, and returns None on this machine while
        KiCad 10.0.5 is installed and working. Falling back to it would let the
        evidence say "verified kicad X" while kicad Y ran.
      * run_round drives PHASE_KICAD_VERIFY after DELTA_CHECK passes, records
        the artifact in the receipt, and returns WITHOUT changing status.
  - tests/test_repair_pipeline.py: `KicadVerifyEvidenceTests`.
  - tasks/PR1-C5-KICAD-VERIFY.yaml
  - docs/compliance/ai-usage/**, docs/compliance/AI_USAGE_LOG.md

  The phase MUST NOT decide the transaction's fate. There is no policy layer yet,
  so nothing consumes the artifact. run_round's status after a successful
  DELTA_CHECK is unchanged by this phase: status=None, terminal=False.

  Out of scope, explicitly:
  - **No COMMIT phase and no promotion.** Still unimplemented.
  - **No gates/**. gates/** is consumed read-only and not edited.
  - **No toolchain binding rewrite.** The binding's kicad executable_sha256 is a
    declared value and nothing verifies the file at the resolved path hashes to
    it -- the same shape as the akcli finding already on record. This phase
    DETECTS and REPORTS that. It does not repair the binding architecture.
  - **No find_kicad_cli() repair**, and no use of it.
  - **No policy layer**, no promotion decision, no threshold.
  - **No qualify_toolchain fix, no recover_incomplete, no feedback learning, no
    planner** -- frozen by Owner direction.
  - **No Evidence-index work.** docs/evidence/** is forbidden.
  - Do NOT touch PR #91 / GH-51.

dependencies: []
  # run_round, the separation guard and the SNAPSHOT phase are merged
  # (#95 c203346, #96 5861fc7, #97 9000ce5, #98 e1724d4); all are ancestors of
  # this base.sha, so the prerequisite is the baseline rather than a ref. A
  # task-id ref must not be declared: tools/admit.py:88 resolves refs by
