acceptance: |
  - tests.test_repair_verification.FreshExportTests 全绿（新增；C2 的
    DeltaAndProtectedTests / SourceParserTests / FixtureProvenanceTests 保持绿）
  - tests.test_repair_verification 全类无回归
  - 小项 1–2 软件行为：旧 XML 残留而导出失败不得通过；exit=0 但空/坏 XML 不得通过；
    导出与解析之间源字节改变必须体现在 source_hash_binding；错 txn/policy/tool 绑定
    必须以 REPAIR_INPUT_DRIFT 拒绝；导出目录非本次新建即 fail-closed
  - 真 KiCad 10.0.5 原生运行（**Owner 复审要求，2026-09-18**）：本机**已有**钉版
    `kicad-cli` 10.0.5（C4 线已验证过 SHA256 `FC142E3B…D0C3`），故原先「本机无 kicad-cli」
    的 `NOT_RUN` 理由**不再成立**。必须用真 kicad-cli 跑一次导出 sanity，并据此验证
    `_kicad_partition()` / `_projected_coverage()` —— PR 自述此前只用**人工构造 XML** 验证过，
    这是最大的未知面
  - **修复 2 个 merge blocker（Owner 复审，均已按代码逐行确认）**：
    - `txn_id` 可逃出 `report_root`：`_text()` 不禁止 `/` `\` `..`，而 `verify_stage` 把它
      直接 join 进 `report_root/exports/<txn_id>/<role>`，`write_thin_verification` 亦把它
      嵌进输出文件名。修法：`txn_id` 必须是 **canonical identifier**；回归
      `txn_id = ../../escape` → 拒绝（`BLOCKED`/`REPAIR_INPUT_DRIFT`）且
      **report_root 之外不产生任何目录/文件**
    - `report_root` 的父级 link / reparse point 未封：原只有 `_absolute()`，随后
      `fresh_export()` 会 `os.makedirs()`。修法：逐组件 no-link 检查（与 C4 同规则），
      并补 Windows junction 回归
  - **修复 P1（Owner 标 should-fix）**：kicad-cli digest 只在**执行前**核一次，
    subprocess 之后**未**复核。修法：`binary digest before == after == manifest digest`，
    与 C4 的 toolchain binding 哲学一致；不一致 → `TOOL_ERROR`/`REPAIR_TOOL_UNAVAILABLE`
  - **C3-P1..C3-P7 扰动资格（Owner 2026-09-18 指示，本轮执行）**：
    `C3PerturbationTests` 逐条施加判据 §2 C3 组的扰动，断言红落在判据指定的字段/状态，
    且七条**均不得产生 PASS**（C3 层不产生 COMMITTED —— 那是 pipeline 的
    TransactionStatus，属 C5，故以「无 PASS」如实记录）。
    - P1 导出失败 + 输出目录残留上一轮旧 XML → `checks.fresh_export` FAIL /
      `REPAIR_EXPORT_STALE`，旧 XML 未被消费；缺 binary → `REPAIR_TOOL_UNAVAILABLE`
    - P2 exit=0 但空/坏 XML → `checks.fresh_export` FAIL / `REPAIR_TOOL_PROTOCOL_ERROR`
    - P3 导出与解析之间改 stage 源 → `checks.source_hash_binding` FAIL / `REPAIR_SOURCE_UNBOUND`
    - P4 verifier 返回后替换报告文件或 stage 源 → 新增只读复核 `recheck_reports()` 与
      `bind_inputs()` 双双拒绝（commit 谓词落空）
    - P5 非 10.0.5 / policy 绑定漂移 / toolchain digest 不符 → 非 PASS，reason 落
      `REPAIR_INPUT_DRIFT`（版本、policy）或 `REPAIR_TOOL_UNAVAILABLE`（digest）
    - P6 漏一个 pin 的导出 → `coverage.after.complete=false` + `REPAIR_COVERAGE_INCOMPLETE`；
      native 与导出分歧 → `parser_agreement.after` FAIL / `REPAIR_PARSER_DISAGREEMENT`
    - P7 必需检查停在 `NOT_RUN` → 整体非 PASS；`deferred.erc` 恒为 `NOT_RUN`（PASS 亦然）
  - **资格过程中发现并修复的真实缺陷（如实记录）**：`_sha()` 是纯校验器（无返回值），
    而 `verify_stage` 写成 `result["patch_sha256"] = _sha(...)` /
    `result["bound_policy_sha256"] = _sha(...)` —— 于是回执里这两个字段**恒为 null**，
    判据 C3-P5 指定的绑定锚点在回执上根本读不到。已改为先校验再显式携带该值，
    并补回归 `test_p5_the_receipt_carries_the_patch_and_policy_bindings`。
  - **第三轮复审整改（Owner 2026-09-19 REQUEST_CHANGES，3 个代码点 + 1 个治理项）**：
    - C3-P7 改为**直接扰动**：其它条件全 PASS、仅 checks.exact_topology_delta = NOT_RUN
      → 整体非 PASS；以及 deferred.erc 被伪写成 PASS → 整体非 PASS。PASS 不变量改为对
      **冻结名字**逐个要求 NOT_RUN（不再读可变 _DEFERRED，避免伪值自证）。
    - **真实依赖 start/end 绑定**：两次导出后重跑 _tree_digest()，与 bind_inputs() 的初始
      before_files / staged_files 全量比较；READONLY_DEPENDENCY 在导出期间被改 → 非 PASS
      （BLOCKED / REPAIR_INPUT_DRIFT）且 dependencies_unchanged = false。原实现只比较两份
      **声明 manifest**，证明的是「声明一致」，不是「真实文件未变」。
    - **执行体绑定**：生产 C3 要求 launcher_argv == []（冻结命令是 kicad-cli sch export
      netlist … 本身，不是「任意 launcher + kicad-cli 当参数」）；测试改走进程 seam
      （mock.patch _spawn），不再把测试注入机制泄漏进生产 toolchain contract。
    - **toolchain library/config 摘要**：toolchain manifest 新增 libraries / configs 两个宿主
      只读 FileManifest（绝对路径 + sha256 + size_bytes + role=READONLY_DEPENDENCY），每次导出
      前后各复核一次；缺失 / 不符 / 运行中变化 → TOOL_ERROR / REPAIR_TOOL_UNAVAILABLE。
    - envelope goal 同步为「四个小项 + P1..P7 资格」；change_budget.contract_change 由
      false 改为 **true**（上述 toolchain manifest 形状变更），理由见本卡注释。
  - 台账 + HANDOFF 如实追加

change_budget:
  expected_files: 6
  expected_modules: [gates, tests, tasks, docs]
  cross_module: true
  # 第三轮复审整改把 C3 toolchain manifest 从「任意 environment 字符串 + 任意 launcher」
  # 改为「launcher_argv 必须为空 + libraries/configs 宿主只读 FileManifest 摘要绑定」，
  # 这是宿主 toolchain 绑定的形状变更，故由 false 改为 true。
  contract_change: true
  evidence_semantics_change: false

