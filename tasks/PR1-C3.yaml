  # rebase 后 docs/ID_MAP.md 与 tools/build_ai_usage_index.py 的改动已被 master 吸收（diff 归零），
  # 故不再列入 allowed_paths —— 本卡不写这两个文件。

forbidden_paths:
  - notes/b5-acceptance/** # 判据冻结后不改（B5 §5/§7）
  - tools/repair_pipeline.py # C5
  - tools/akcli_adapter.py # C4
  - gates/run_gates.py
  - gates/schematic_semantics.py
  - gates/contracts/**
