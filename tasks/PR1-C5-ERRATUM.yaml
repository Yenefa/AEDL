acceptance: |
  - **Owner grant 前置：已满足（历史事实）。**
    Scope grant: https://github.com/Yenefa/AEDL/issues/83#issuecomment-5754735874
    Admission: ADMIT / exit 0（本条状态文案收口后已重新 admission）
  - **申请顺序（architecture review 最高指示，2026-09-20）—— 已执行完毕，本条为历史事实，不再表示 PENDING**：
    先取得 architecture review 的 DESIGN_ACCEPTED / READY_FOR_HUMAN_SCOPE_GRANT，
    然后才在 issue #83 请求 human Owner 明确批准 contract_change: true 与
    gates/repair_verification.py 的 scope expansion。
  - 新对象 expected 形状为 closed schema，且与旧形状互斥（混用 → ObservationError）
  - _delta() 与 _projection() 的函数体**零改动**（diff 可逐行核对）
  - existing object full AST exact 不放松（回归 R1）
  - removed object exact UUID + kind + descriptor digest 不放松（回归 R2/R3）
  - old UUID 复用 → FAIL（R4）；额外 source object → FAIL（R5）；
    缺 expected 新对象 → FAIL（R6）
  - new label 语义字段错 → FAIL，且必须**不是**被 mask 掉（R7）
  - 两个真实 label 与同一 expected semantic tuple 匹配 → FAIL（R8）
  - 新 symbol source-object UUID 与 aligned component_uuid 绑定断言成立（R9，**integration-path**：
    真实 AFTER full object → _align_new → _canonicalize_new_objects → compare_delta + compare_protected，
    不得只单测 helper；原 R13 已折入本条）
  - expected new object 混用形状 → **UNKNOWN / REPAIR_COVERAGE_INCOMPLETE**（R10；human review correction 2026-09-21：原写 FAIL，实测 taxonomy 为 UNKNOWN，安全性质是「永不 PASS」）
  - protected_projection_sha256 在 before 侧不因新对象语义改变而改变（R11）
  - new symbol 携带 exclude_from_sim=yes → FAIL（R12，v1 只允许 false/absent）；
    该条必须**同时**落在 §6 回归矩阵、本 acceptance 与 §8 implementation impact
  - **M1（Percy review 5279038034 / 2026-09-22）—— 本 PR 自己引入的 regression，必须修复。**
    §7.4 **superseded / revised after native calibration**：原拒绝理由为「需要真实 DC-04 / DC-05
    AFTER 校准才能定形」，该前置已由本 PR 的 native 校准满足。新的口径：
    新 symbol 的**实例层** property 名必须闭集于 native 校准支持的集合
    `_ALLOWED_NEW_SYMBOL_PROPERTIES = {Reference, Value, Footprint}`；集合外 → `_BindingError`。
    只用校准支持的名称，**不得**因「看起来合理」把 `Datasheet` / `Description` 等塞进实例白名单
    （`Datasheet` 只在内嵌库定义内，见 pinned `writers/symbol_lib.py:113-118`）。
    · 正常新 symbol（DC-04 R9 / DC-05 C5）→ PASS（**不得 false-negative**）
    · 新 symbol + `Sim.Params` → FAIL（回归 R13）
    · 新 symbol + `Sim.Device` → FAIL（回归 R13）
    · existing symbol + 额外 property → 仍 FAIL（既有 full AST exact 不放松）
    §7.5 presentation freedom **保留**：自由度只存在于已批准 property 内部的
    `at` / `effects` / `fields_autoplaced` / writer UUID。
    「presentation metadata 可以自由」≠「可以凭空增加任意 property 名」。
  - R13 的测试在变异后**必须重算 `semantic_ast_sha256`**，否则两侧都返回
    `UNKNOWN / REPAIR_COVERAGE_INCOMPLETE`（那是观测完整性在抓篡改，不是 C2 抓到属性）
  - py -3.9 -X utf8 -m unittest tests.test_repair_verification → 全绿
  - py -3.9 -X utf8 -m unittest discover -s tests → 无回归
  - py -3.9 -m tools.dev_gate --envelope tasks/PR1-C5-ERRATUM.yaml → exit 0
  - 台账 + HANDOFF 如实追加；状态 PENDING_HUMAN_REVIEW

