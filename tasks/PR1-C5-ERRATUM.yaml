acceptance: |
  - **Owner grant 前置**：Owner 于 issue #83 明确批准 scope expansion 之前，
    不得 admission、不得改任何代码。decision_ref 必须是人工评论 permalink。
  - **申请顺序（architecture review 最高指示，2026-09-20）**：先取得 architecture review 的
    DESIGN_ACCEPTED / READY_FOR_HUMAN_SCOPE_GRANT，然后才在 issue #83 请求 human Owner
    明确批准 contract_change: true 与 gates/repair_verification.py 的 scope expansion。
    当前 Owner scope grant 保持 PENDING，不得提前申请。
  - 新对象 expected 形状为 closed schema，且与旧形状互斥（混用 → ObservationError）
  - _delta() 与 _projection() 的函数体**零改动**（diff 可逐行核对）
  - existing object full AST exact 不放松（回归 R1）
  - removed object exact UUID + kind + descriptor digest 不放松（回归 R2/R3）
  - old UUID 复用 → FAIL（R4）；额外 source object → FAIL（R5）；
    缺 expected 新对象 → FAIL（R6）
  - new label 语义字段错 → FAIL，且必须**不是**被 mask 掉（R7）
  - 两个真实 label 与同一 expected semantic tuple 匹配 → FAIL（R8）
  - 新 symbol source-object UUID 与 aligned component_uuid 绑定断言成立（R9，**integration-path**：
    真实 AFTER full object → _align_new → _canonicalize_new_objects → compare_delta + compare_protected，
    不得只单测 helper；原 R13 已折入本条）
  - expected new object 混用形状 → FAIL（R10）
  - protected_projection_sha256 在 before 侧不因新对象语义改变而改变（R11）
  - new symbol 携带 exclude_from_sim=yes → FAIL（R12，v1 只允许 false/absent）；
    该条必须**同时**落在 §6 回归矩阵、本 acceptance 与 §8 implementation impact
  - **不要求** property 名称集合闭合（architecture review 明确不批准，易 false-negative）
  - py -3.9 -X utf8 -m unittest tests.test_repair_verification → 全绿
  - py -3.9 -X utf8 -m unittest discover -s tests → 无回归
  - py -3.9 -m tools.dev_gate --envelope tasks/PR1-C5-ERRATUM.yaml → exit 0
  - 台账 + HANDOFF 如实追加；状态 PENDING_HUMAN_REVIEW

exceptions:
  # 人工 grant 见上方 decision_ref。granted_by 写人类操作者；
  # **不得**把任何技术 review 结论（如 DESIGN_ACCEPTED）当作 granted_by。
  allow_drift:
    granted_by: Yenefa
    decision_ref: "https://github.com/Yenefa/AEDL/issues/83#issuecomment-5754735874"
    reason: "Envelope-first governance (same precedent as PR1-C5 / PR1-C5-PRE): the envelope claim is committed alone from base 669aa1622385d598758c0376bc874ff7ca0842f8 before admission, so HEAD necessarily differs from base.sha from that first commit onward while the worktree stays clean at admission time. This exception authorizes --allow-drift on branch feat-pr1-c5-erratum for that drift, and nothing else: it does not include allow_dirty; it does not authorize any functional code (gates/repair_verification.py, tests/test_repair_verification.py) to enter the worktree before admission passes; it does not authorize restoring PR1-C5; and it does not relax existing-object protection, removal descriptor binding, exact topology or the protected projection."

escalation:
  owner: Yenefa
