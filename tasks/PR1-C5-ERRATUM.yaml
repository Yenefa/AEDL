# regression**（新 symbol 的额外 property 名在两层之间漏检：master FAIL → #87 PASS）。
# Owner 决定：remedy = **A（property 名闭集）**；**扩本 envelope 而不另开卡**；
# whitelist 只用 native 校准支持的实例层名称 {Reference, Value, Footprint}；
