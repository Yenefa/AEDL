acceptance: |
  - migrate 幂等：同一 AI_USAGE_LOG.md 跑两次结果一致（第二次 0 条新迁移）。
  - 最终源台账条目无遗漏；内部字节保留；已披露 stub 补记必须单独调和并保留 diff。
    索引恰好引用完整旧条目与新 actor 条目集合，无重复，不使用旧 head 固定计数。
  - 同 ID 同正文 skip；不同正文 HARD FAIL，且预检失败不留下新条目的部分批次。
  - 同 actor 不同分支/并发创建，使用独立随机 ID；本地碰撞重试不覆盖。
  - 索引 count/summary 手改、目录杂项必须 FAIL；缺 summary 的生成结果有可见 fallback。
  - check 对迁移后的仓库 PASS；对注入的重复 ID / 非法格式 / 日期失配 fail-closed。
  - dev_gate receipt 包含 ai_usage_ledger 检查且 PASS。
  - 全量测试（主仓库 unittest discover）通过。

