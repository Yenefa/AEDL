# Minimal CI (Layer 1 automatic verification) - Issue #8, GH-20
# ONE job, ONE gate entry: `python -m tools.dev_gate` — the same executable local
# agents and humans run. CI covers the universal required checks:
#   syntax / main tests / sandbox tests (uv provided by setup-uv) / secret scan
# Task-context checks (scope_check / binding_check) require an envelope and an
# admission receipt and are performed in the task workspace, not in generic CI.
# LF byte baseline (.gitattributes): the same full test set runs on every
# platform - no platform-specific test exclusions.
# Formal Evidence gates (gates/run_gates.py / KiCad / ESP-IDF) are deliberately
# NOT run here: a CI PASS is a development verification receipt, not Evidence.
# NOTE: GH-20 Verification Policy Change (SHARED/HIGH-RISK) - requires both
# human owners (Yenefa + Percy) to confirm before merge.
name: minimal-ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  dev-gate:
    name: Development gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9" # main repo suite (matches local dev env py -3 = 3.9.13)
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.19" # pinned: pre-seeded in runner tool cache (no GitHub download)
          python-version: "3.11" # sandbox runtime (pinned by uv.lock)
      - name: Development gate (compileall + main tests + sandbox tests + secret scan)
        env:
          # setup-uv creates a repo-root .venv that shadows `python` on Windows
          # runners; pin the exact setup-python interpreter instead.
          AEDL_PYTHON: ${{ runner.os == 'Windows' && format('{0}\\python.exe', env.pythonLocation) || 'python' }}
          PYTHONIOENCODING: utf-8 # Windows runner consoles default to cp1252
          PYTHONUTF8: "1"
        run: python -m tools.dev_gate
