; ESP-IDF 框架（替代 Arduino）：G9 修复——IDF+Wokwi+C3 串口捕获为 Espressif 官方 CI 验证过的组合
[common]
fw_flags = -Wall -Wextra

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
build_flags =
    ${common.fw_flags}

[env:esp32c3_simstub]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
build_flags =
    ${common.fw_flags}
    -DSIM_STUB_SENSOR

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
